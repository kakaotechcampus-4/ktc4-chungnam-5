name: Deploy (EC2)
# 배포 계획서 H2 — 운영 EC2 에 배포한다. SSH 도 AWS 액세스 키도 쓰지 않는다:
# OIDC 로 배포 역할 `ktc-github-deploy` 를 받고(H1), `aws ssm send-command` 로 서버의
# `infra/deploy.sh` 를 실행한다. 배포 로직은 이 파일이 아니라 deploy.sh 에 있다.
#
# 실행
#   - 릴리스: 버전 태그(`vYYYY.MM.DD`, 같은 날 두 번째부터 `.1` …)를 push 하면 그 커밋을 배포한다 (H3).
#   - 수동: Actions 탭 → "Deploy (EC2)" → Run workflow → `main`. 버전 없이 SHA 로 배포된다 (급할 때만).
#   main 에 없는 커밋은 deploy.sh 가 거절한다 — 다른 브랜치로 수동 실행해도 운영은 그대로다.
#
# 이 파일은 실행되는 커밋 안에 있어야 한다 — main 에 머지된 뒤부터 쓸 수 있다.
# 필요한 저장소 Variables (Secrets 아님): AWS_ACCOUNT_ID · EC2_INSTANCE_ID · DEPLOY_DOMAIN

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  id-token: write # 빠지면 GitHub 이 OIDC 토큰을 발급하지 않는다
  contents: read

# 배포가 겹치지 않게 한 번에 하나씩. 진행 중인 배포는 취소하지 않는다 —
# 중간에 끊으면 워커가 내려간 채로 남을 수 있다 (deploy.sh 는 워커를 먼저 내린다).
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40 # 역할 세션 한도는 1시간
    env:
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          aws-region: ap-northeast-2

      - name: 서버에서 deploy.sh 실행
        run: |
          # send-command 는 root 로 돈다. 저장소 · 잠금 파일 주인이 ubuntu 라 ubuntu 로 바꿔 실행한다.
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_REF_NAME} ${GITHUB_SHA::7}" \
            --parameters "commands=[\"runuser -u ubuntu -- /opt/glp1/infra/deploy.sh $GITHUB_SHA\"],executionTimeout=[\"1800\"]" \
            --query Command.CommandId --output text)
          echo "commandId=$CMD_ID"
          # aws ssm wait 는 100초면 포기한다 — 빌드가 더 걸리므로 직접 폴링한다 (10초 × 180 = 30분).
          # 보낸 직후에는 호출이 아직 등록되지 않아 에러가 나므로 Pending 으로 본다.
          STATUS=Pending
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "status=$STATUS"
          [ "$STATUS" = Success ]

      - name: 헬스 체크 (이번 커밋이 떠 있는지까지 확인)
        run: |
          # /health 는 데모 키 없이 통과한다 (Caddyfile). sha 는 자르지 않은 전체 SHA 다 (H3) —
          # 짧은 SHA 는 길이가 바뀔 수 있어 비교에 쓰지 않는다.
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "https://${{ vars.DEPLOY_DOMAIN }}/health" \
            | tee /dev/stderr | grep -q "\"sha\":\"${GITHUB_SHA}\""
