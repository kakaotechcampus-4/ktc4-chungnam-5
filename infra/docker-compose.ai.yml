# 실제 AI Service.
#
#   docker compose -f docker-compose.ai.yml up -d --build
#
# ai-stub 과 같은 compose 프로젝트(infra)에 속해 같은 네트워크에 붙는다.
# 호스트 포트는 8002 — BE 8000 · ai-stub 8001 과 겹치지 않아 셋을 함께 띄울 수 있다.
# 컨테이너끼리는 호스트 포트가 아니라 서비스 이름 + 내부 8000 으로 붙는다.
#
# 먼저 할 것:
#   cp ../ai/.env.example ../ai/.env   # LLM_API_KEY 등을 채운다
#
# BE 를 실제 AI 에 붙이려면 (기본은 ai-stub):
#   BE_AI_SERVICE_BASE_URL=http://ai:8000 docker compose -f docker-compose.be.yml up -d

services:
  ai:
    build:
      context: ../ai
    image: glp1-ai
    container_name: glp1-ai
    ports:
      - "8002:8000"
    # LLM 키 같은 비밀은 여기 적지 않는다 — 이 repo 는 public 이다. ai/.env 는 gitignore 대상이다.
    # 파일이 없어도 기동은 된다(키가 없으면 앱이 부팅 검증에서 죽는다).
    env_file:
      - path: ../ai/.env
        required: false
    # BE /internal/v1(tool 역호출)은 아직 없다 — AI 파트와 tool 설계를 합의한 뒤 붙인다.
    # 그때 여기 environment 로 BE_INTERNAL_BASE_URL(http://api:8000/internal/v1) ·
    # INTERNAL_SERVICE_TOKEN 을 넣는다. 컨테이너에서는 localhost 가 자기 자신이다.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 3s
      retries: 3
      # LLM 클라이언트 초기화·설정 검증에 시간이 걸릴 수 있어 ai-stub 보다 넉넉히 둔다.
      start_period: 15s
    restart: unless-stopped
