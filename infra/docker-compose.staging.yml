# 스테이징(develop) 스택. 운영 compose 위에 덮어쓴다 — deploy-staging.sh 가 부른다.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.staging.yml --env-file .env.staging ...
#
# 같은 EC2 에 운영과 함께 뜬다. 겹치면 안 되는 것만 바꾼다:
#  - 프로젝트 이름 → 볼륨·기본 네트워크가 glp1-staging_* 로 갈린다. 운영 DB 볼륨을 건드릴 길이 없다
#  - 컨테이너 이름·이미지 태그 → 스테이징 빌드가 운영 이미지(glp1-prod-*)를 develop 코드로 덮어쓰지 않는다
#  - caddy → 띄우지 않는다. 80/443 은 운영 Caddy 하나가 맡고 glp1-edge 로 스테이징 api 에 닿는다
#  - mem_limit 은 스테이징이 쓸 수 있는 양을 묶고(합 약 1.8GiB, 배포 중 api 두 개가 겹칠 때만 +512MiB), oom_score_adj 는 서버 전체 메모리가 모자랄 때
#    OOM killer 가 운영 대신 스테이징을 먼저 고르게 한다 (4GiB 서버)
#
# .env.staging 은 .env.prod 를 복사해 DB_PASSWORD · INTERNAL_SERVICE_TOKEN 만 새로 만든다.
# DOMAIN · STAGING_DOMAIN 은 여기서 쓰이지 않지만 운영 파일의 ${...:?} 검사를 통과하려면 채워 둔다.
name: glp1-staging

services:
  db:
    container_name: glp1-staging-db
    mem_limit: 384m
    oom_score_adj: 500

  # 운영 Caddy 가 컨테이너 이름(glp1-staging-api-blue / -green)으로 찾아온다.
  # 둘이 함께 뜨는 건 배포 중 몇십 초뿐이다.
  api-blue: &api
    image: glp1-staging-be:${BLUE_TAG:-none}
    container_name: glp1-staging-api-blue
    networks:
      default:
        aliases: [api]
      edge: {}
    mem_limit: 512m
    oom_score_adj: 500

  api-green:
    <<: *api
    image: glp1-staging-be:${GREEN_TAG:-none}
    container_name: glp1-staging-api-green

  migrate:
    image: glp1-staging-be:${BE_TAG:-none}
    mem_limit: 512m
    oom_score_adj: 500

  worker:
    image: glp1-staging-be:${BE_TAG:-none}
    container_name: glp1-staging-worker
    mem_limit: 512m
    oom_score_adj: 500

  ai:
    image: glp1-staging-ai
    container_name: glp1-staging-ai
    mem_limit: 256m
    oom_score_adj: 500

  ai-stub:
    image: glp1-staging-ai-stub
    container_name: glp1-staging-ai-stub
    mem_limit: 128m
    oom_score_adj: 500

  caddy:
    profiles: [disabled]

networks:
  edge:
    external: true
    name: glp1-edge
