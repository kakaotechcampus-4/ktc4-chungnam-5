# ElasticMQ — SQS API 호환 서버. 로컬 개발에서 AWS SQS 대신 쓴다.
#
# 프로덕션과 같은 boto3 코드가 그대로 붙는다. visibility timeout · 재시도 ·
# DLQ 재배치가 실제 SQS 와 같게 동작하므로, 배포 후에 의미가 달라지지 않는다.

include classpath("application.conf")

node-address {
    protocol = http
    host = "localhost"
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    sqs-limits = strict
}

# 웹 UI 는 없다. elasticmq-native 1.7.1 에는 rest-stats 서버가 들어 있지 않아
# 설정을 넣어도 조용히 무시된다. 큐 상태는 GetQueueAttributes 로 확인한다 —
# backend/scripts/queue_status.py 참고.

queues {
    glp1-tasks {
        # 작업을 꺼낸 뒤 이 시간 동안 다른 소비자에게 보이지 않는다.
        # AI 호출이 10~30초 걸리므로 그보다 넉넉해야 한다.
        defaultVisibilityTimeout = 60 seconds

        # 롱 폴링. 빈 큐를 계속 때리지 않는다.
        receiveMessageWait = 5 seconds

        deadLettersQueue {
            name = "glp1-tasks-dlq"
            # 3번 배달되고도 삭제되지 않으면 DLQ 로 옮긴다.
            # ai-stub 의 X-Stub-Scenario: ERROR_500 으로 이 경로를 밟을 수 있다.
            maxReceiveCount = 3
        }
    }

    glp1-tasks-dlq {
        defaultVisibilityTimeout = 60 seconds
    }

    # 테스트 전용. Worker 는 이 큐를 폴링하지 않으므로, 개발용 컨테이너를 띄워 둔 채로도
    # pytest 가 간섭 없이 돈다. 설정은 위와 같게 유지할 것 — 다르면 검증이 의미가 없다.
    glp1-tasks-test {
        defaultVisibilityTimeout = 60 seconds
        receiveMessageWait = 5 seconds
        deadLettersQueue {
            name = "glp1-tasks-test-dlq"
            maxReceiveCount = 3
        }
    }

    glp1-tasks-test-dlq {
        defaultVisibilityTimeout = 60 seconds
    }
}
