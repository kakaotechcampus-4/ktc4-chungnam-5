# BE — 이미지 하나로 컨테이너 둘 (D4).
#
#   docker compose -f docker-compose.be.yml up -d
#
# ai-stub 와 같은 compose 프로젝트(infra)에 속하므로 같은 네트워크에 붙는다.
# 그래서 아래 주소들이 localhost 가 아니라 **서비스 이름**이다 —
# 컨테이너 안에서 localhost 는 자기 자신을 가리킨다.
#
# 먼저 띄워 둘 것:
#   docker compose -f docker-compose.yml         up -d    # db
#   docker compose -f docker-compose.ai-stub.yml up -d    # ai-stub

x-be-env: &be-env
  # 컨테이너 안에서는 서비스 이름으로 붙는다. 호스트에 매핑된 5433 이 아니라 내부 5432 다.
  DB_URL: db:5432/glp1_dev
  DB_USER: glp1
  DB_PASSWORD: glp1_local_dev
  # 큐는 위 DB 의 task_queue 테이블이다. 별도 컨테이너가 없다.
  QUEUE_POLL_INTERVAL_SEC: "1.0"
  QUEUE_MAX_ATTEMPTS: "3"
  QUEUE_BACKOFF_BASE_SEC: "30"
  AI_SERVICE_BASE_URL: http://ai-stub:8000
  # 실패 경로를 보고 싶을 때만 채운다. 예: ERROR_500
  AI_STUB_SCENARIO: ""

services:
  api:
    build:
      context: ../backend
    image: glp1-be
    container_name: glp1-api
    ports:
      - "8000:8000"
    environment: *be-env
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      context: ../backend
    image: glp1-be
    container_name: glp1-worker
    # API 와 같은 이미지, 다른 진입점
    command: ["python", "-m", "app.worker_main"]
    environment: *be-env
    restart: unless-stopped
