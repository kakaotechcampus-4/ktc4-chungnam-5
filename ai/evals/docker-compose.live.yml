# 별도 로컬 통합 실험. 운영/개발 컨테이너와 이름·볼륨·네트워크를 공유하지 않는다.
# AI_LIVE_ENV_FILE은 기존 ai/.env의 절대 경로다. 비밀값을 이 파일에 복사하지 않는다.
#
# AI_LIVE_ENV_FILE=/absolute/path/to/ai/.env docker compose \
#   -p ktc-food-live-20261109 -f ai/evals/docker-compose.live.yml up -d --build --wait
#
# config 출력에는 env_file의 비밀값도 들어간다. 검증에는 config --quiet를 사용한다.
name: ktc-food-live

x-be-build: &be-build
  context: ../../backend
  target: app
  args:
    GIT_SHA: ${LIVE_GIT_SHA:-}

x-be-env: &be-env
  APP_ENV: local
  DB_URL: db:5432/food_live
  DB_USER: food_live
  # 외부 DB의 비밀번호가 아닌, 이 프로젝트 전용 로컬 테스트 DB 자격증명이다.
  DB_PASSWORD: food_live_local_only
  DB_ECHO: "false"
  AI_SERVICE_BASE_URL: http://ai:8000
  AI_TIMEOUT_SEC: "45"
  AI_STUB_SCENARIO: ""
  QUEUE_POLL_INTERVAL_SEC: "1.0"
  QUEUE_MAX_ATTEMPTS: "3"
  QUEUE_BACKOFF_BASE_SEC: "30"
  QUEUE_LEASE_SEC: "120"
  QUEUE_WORKER_THREADS: "4"
  STORAGE_TYPE: local
  LOCAL_STORAGE_DIR: /srv/var/media
  LOCAL_STORAGE_BASE_URL: http://api:8000/media

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: food_live
      POSTGRES_PASSWORD: food_live_local_only
      POSTGRES_DB: food_live
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    ports:
      - "127.0.0.1:${LIVE_DB_PORT:-15433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U food_live -d food_live"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # 현재 SHA로 고정한 시드는 이미 이름 병합/100g 환산된 276,092행이다.
  # 기존 실험과 같은 구 스키마 → 시드 → head 순서를 재현하고 최종 상태를 검증한다.
  schema-base:
    build: *be-build
    environment: *be-env
    command: [python, /evals/live_db_bootstrap.py, prepare]
    volumes:
      - ./live_db_bootstrap.py:/evals/live_db_bootstrap.py:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    image: postgres:17-alpine
    environment:
      PGHOST: db
      PGUSER: food_live
      PGPASSWORD: food_live_local_only
      PGDATABASE: food_live
    command: [sh, /evals/live_db_seed.sh]
    volumes:
      - ./live_db_seed.sh:/evals/live_db_seed.sh:ro
      - ../../infra/seed/food_refs_20260828.dump:/seed/food_refs.dump:ro
    depends_on:
      schema-base:
        condition: service_completed_successfully
    restart: "no"

  migrate:
    build: *be-build
    environment: *be-env
    command: [python, /evals/live_db_bootstrap.py, finalize]
    volumes:
      - ./live_db_bootstrap.py:/evals/live_db_bootstrap.py:ro
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: "no"

  ai:
    build:
      context: ..
    env_file:
      - path: ${AI_LIVE_ENV_FILE:?Set AI_LIVE_ENV_FILE to the existing ai/.env absolute path}
        required: true
    # 실제 app과 HTTP 통신은 그대로 두고 실험 파일에만 모델 시도 원문을 관측한다.
    command: [uvicorn, evals.live_vision_app:app, --host, 0.0.0.0, --port, "8000"]
    environment:
      AI_LIVE_CAPTURE_DIR: /capture
    volumes:
      - ./:/srv/evals:ro
      - ${AI_LIVE_CAPTURE_HOST_DIR:?Set AI_LIVE_CAPTURE_HOST_DIR to a separate experiment directory}:/capture
    ports:
      - "127.0.0.1:${LIVE_AI_PORT:-18002}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  api:
    build: *be-build
    environment: *be-env
    ports:
      - "127.0.0.1:${LIVE_API_PORT:-18000}:8000"
    volumes:
      - media:/srv/var/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      ai:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    build: *be-build
    environment: *be-env
    command: [python, -m, app.worker_main]
    volumes:
      - media:/srv/var/media
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from sqlalchemy import create_engine, text; from app.core.config import get_settings; create_engine(get_settings().sqlalchemy_dsn).connect().execute(text('select 1'))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  db-data:
  media:
